[package]
name = "rocker"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rocker"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
bollard = "0.21"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
